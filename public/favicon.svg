<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1924" />
      <stop offset="100%" stop-color="#0f0e13" />
    </linearGradient>

    <!-- Gold / Citron Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb60" />
      <stop offset="100%" stop-color="#e5b429" />
    </linearGradient>

    <!-- Lavender Gradient -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container Base with Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38334a" stroke-width="2"/>

  <!-- RIFT Signature Geometric Mark -->
  <!-- Lavender Wing / Shield Shape -->
  <path d="M 28 24 C 28 24, 48 20, 50 36 C 52 48, 38 52, 28 50 C 24 49, 22 42, 22 36 Z" 
        fill="url(#lavenderGrad)" 
        opacity="0.95" 
        filter="url(#glow)" />

  <!-- Gold Circle Overlay with Rift Notch -->
  <circle cx="25" cy="25" r="14" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Dynamic Inner Rift Slash in Dark Obsidian -->
  <path d="M 18 16 L 31 16 C 36 16, 39 19, 39 23 C 39 26, 37 28.5, 34 29.5 L 42 42 L 34.5 42 L 27.5 30.5 L 24 30.5 L 24 42 L 18 42 Z M 24 21 L 24 26 L 30 26 C 32 26, 33 25, 33 23.5 C 33 22, 32 21, 30 21 Z" 
        fill="#0f0e13" />

  <!-- Accent Rift Energy Cut -->
  <polygon points="34,14 36,12 28,34 26,36" fill="#ffffff" opacity="0.85"/>
</svg>
